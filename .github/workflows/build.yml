name: Native build checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libegl1-mesa-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +1.100.0 fmt --check
      - name: Lint
        run: cargo +1.100.0 clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo +1.100.0 test --locked
      - name: Build
        run: cargo +1.100.0 build --release --locked
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup override set 1.100.0
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: shuffle-room-windows-x64-native-build
          path: dist/shuffle-room-windows-x64-preview.zip
